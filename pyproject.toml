[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "educational-video-automation"
version = "0.1.0"
description = "Resumable topic-to-video production pipeline"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "Pillow>=10,<13", "httpx>=0.27,<1", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
video-automation = "video_automation.cli:main"

[tool.setuptools.packages.find]
include = ["video_automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
